services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.jobs.queue"]
    depends_on:
      - redis
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pr_concierge
      POSTGRES_USER: prc
      POSTGRES_PASSWORD: prc_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata: